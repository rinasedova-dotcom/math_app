<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Math Quiz — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <h1>🧮 Math Quiz</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="results.html">Results</a>
    <a href="points.html">🏆 Points</a>
  </nav>
</header>
<main>
  <div class="card" id="quiz-card">
    <p id="loading-msg">Loading question…</p>
  </div>
</main>
<footer class="pagefoot" id="pool-info"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script>
let pool = [];
let current = null;
let answered = false;
let lastKey = null;
let statusMap = new Map();

function questionKey(item) {
  return item.courseId + "-" + item.question.number;
}

// getResults() returns rows in ascending timestamp order, so later entries
// for the same question naturally overwrite earlier ones with the latest result.
function buildStatusMap(results) {
  const map = new Map();
  results.forEach(r => {
    map.set(r.courseId + "-" + r.questionNumber, r.isCorrect);
  });
  return map;
}

function getCandidatePools() {
  const unseen = [];
  const wrong = [];
  const mastered = [];
  pool.forEach(item => {
    const key = questionKey(item);
    if (!statusMap.has(key)) {
      unseen.push(item);
    } else if (statusMap.get(key) === false) {
      wrong.push(item);
    } else {
      mastered.push(item);
    }
  });
  return { unseen, wrong, mastered };
}

function pickQuestion() {
  if (pool.length === 0) return null;
  const { unseen, wrong, mastered } = getCandidatePools();
  const candidates = unseen.length > 0 ? unseen : (wrong.length > 0 ? wrong : mastered);
  if (candidates.length <= 1) return candidates[0];
  let choice;
  do {
    choice = candidates[Math.floor(Math.random() * candidates.length)];
  } while (lastKey && questionKey(choice) === lastKey);
  return choice;
}

function renderQuestion() {
  current = pickQuestion();
  answered = false;
  if (!current) {
    document.getElementById("quiz-card").innerHTML = "<p>No questions available for the selected course(s).</p>";
    return;
  }
  lastKey = current.courseId + "-" + current.question.number;
  const q = current.question;
  const card = document.getElementById("quiz-card");
  const { unseen, wrong } = getCandidatePools();
  const remaining = unseen.length + wrong.length;

  let mediaHtml = "";
  if (q.image) {
    mediaHtml += `<div class="question-image"><img src="${current.imagePath}/${q.image}" alt="Question diagram"></div>`;
  }
  if (q.table) {
    mediaHtml += `<table class="puzzle-table">` + q.table.map(row =>
      "<tr>" + row.map(cell => `<td>${cell}</td>`).join("") + "</tr>"
    ).join("") + `</table>`;
  }

  const hasOptionText = q.options.some(o => o.text && o.text.trim() !== "");
  const optionsClass = hasOptionText ? "options text-options" : "options";

  const optionsHtml = q.options.map(o => `
    <button class="option" data-label="${o.label}">
      <span class="letter">${o.label}</span>
      <span class="opt-text">${o.text || ""}</span>
    </button>
  `).join("");

  card.innerHTML = `
    <div class="question-meta">
      <span class="badge course">${current.courseName}</span>
      <span class="badge points">Question ${q.number} · ${q.points} pts</span>
      <span class="badge progress">${remaining} question${remaining === 1 ? "" : "s"} left to master</span>
    </div>
    <div class="question-text">${q.text}</div>
    ${mediaHtml}
    <div class="${optionsClass}" id="options-wrap">${optionsHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="btn" id="next-btn" style="display:none;">Next question →</button>
    </div>
  `;

  document.querySelectorAll(".option").forEach(btn => {
    btn.addEventListener("click", () => handleAnswer(btn.dataset.label));
  });
}

async function handleAnswer(label) {
  if (answered) return;
  answered = true;
  const q = current.question;
  const isCorrect = label === q.answer;
  statusMap.set(current.courseId + "-" + q.number, isCorrect);

  document.querySelectorAll(".option").forEach(btn => {
    btn.classList.add("disabled");
    if (btn.dataset.label === q.answer) {
      btn.classList.add("correct");
    } else if (btn.dataset.label === label) {
      btn.classList.add("wrong");
    }
  });

  const feedback = document.getElementById("feedback");
  feedback.classList.add("show", isCorrect ? "right" : "wrong");
  feedback.textContent = isCorrect
    ? "Correct! Well done."
    : `Not quite — the correct answer is ${q.answer}.`;

  document.getElementById("next-btn").style.display = "inline-block";
  document.getElementById("next-btn").addEventListener("click", renderQuestion);

  const saved = await saveResult({
    courseId: current.courseId,
    courseName: current.courseName,
    questionNumber: q.number,
    questionText: q.text,
    answerGiven: label,
    correctAnswer: q.answer,
    isCorrect: isCorrect,
  });
  if (!saved) {
    feedback.textContent += " (Note: couldn't save this result — check your connection.)";
  }
}

async function init() {
  const prefs = getPrefs();
  let allCourses, results;
  try {
    [allCourses, results] = await Promise.all([loadAllCourses(), getResults()]);
  } catch (e) {
    document.getElementById("quiz-card").innerHTML =
      "<p>Could not load course data. Please serve this site with a local web server.</p>";
    return;
  }
  const selectedIds = prefs.selectedCourseIds && prefs.selectedCourseIds.length
    ? prefs.selectedCourseIds
    : allCourses.map(c => c.id);

  pool = buildQuestionPool(allCourses, selectedIds);
  statusMap = buildStatusMap(results);
  document.getElementById("pool-info").textContent =
    pool.length + " question(s) in the current practice pool.";
  renderQuestion();
}

init();
</script>
</body>
</html>
